services:
  - type: web
    name: bhook-api
    runtime: node
    plan: free
    region: singapore
    rootDir: food-finder
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: DB_CONNECTION_LIMIT
        value: "5"
      - key: ENABLE_SWIGGY_ADMIN_TOOLS
        value: "false"
      - key: ENABLE_PUBLIC_LIVE_PRICE_CHECK
        value: "false"
      - key: LUCKNOW_SYNC_ENABLED
        value: "false"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
